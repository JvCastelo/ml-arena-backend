repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      # Roda o linter e já conserta automaticamente o que for seguro (ex: imports)
      - id: ruff
        args: [ --fix ]
      # Roda o formatador (substituto ultra-rápido do Black)
      - id: ruff-format
