[project]
name = "ml-arena-backend"
version = "0.1.0"
description = "ML Arena: registro e comparação de runs de modelos de ML (FastAPI + AWS)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt==3.2.2",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint.per-file-ignores]
# Células de notebook aceitam `await` no topo; o ruff lê como .py comum.
"notebooks/*" = ["F704", "PLE1142"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
